                &lt;div class=&quot;guide-container&quot;&gt;
                    &lt;div class=&quot;guide-section&quot;&gt;
                        &lt;h2&gt;📖 How Taiwanese Tone Sandhi Works&lt;/h2&gt;
                        &lt;p style=&quot;font-size: 14px; line-height: 1.5; color: var(--text-secondary);&quot;&gt;
                            在臺灣台語中，當兩個或更多音節組合成一個詞組（或句子）時，**除了最後一個音節維持本調外，前面的音節皆須變調**。這種語音現象稱為**連讀變調 (Tone Sandhi)**。
                        &lt;/p&gt;
                        &lt;ul style=&quot;font-size: 13px; color: var(--text-secondary); margin-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.5;&quot;&gt;
                            &lt;li&gt;&lt;strong&gt;二字詞組 (2-Syllable)&lt;/strong&gt;：第 1 字變調，第 2 字維持本調（例如：驚人 kiann1+lang5 ➔ kiāⁿ-lâng）。&lt;/li&gt;
                            &lt;li&gt;&lt;strong&gt;三字詞組 (3-Syllable)&lt;/strong&gt;：第 1、2 字變調，第 3 字維持本調（例如：台灣人 tai5+uan5+lang5 ➔ Tāi-uān-lâng）。若末字為輕聲，則倒數第二字讀本調，最前字變調。&lt;/li&gt;
                            &lt;li&gt;&lt;strong&gt;四字詞組 (4-Syllable)&lt;/strong&gt;：依結構不同有兩種變調方式：
                                &lt;br&gt;1. *連續變調 (Sequential)*：前 3 字變調，第 4 字維持本調。
                                &lt;br&gt;2. *兩兩變調 (2+2 Split)*：常用于複合詞組（如「台灣大學」），拆為前二字一組（1變調 ➔ 2本調）與後二字一組（3變調 ➔ 4本調）。
                            &lt;/li&gt;
                        &lt;/ul&gt;
                    &lt;/div&gt;

                            Standard (non-entering) tones change in a circular loop, while entering tones (ending in stop consonants) have dedicated rules.

                        &lt;div class=&quot;sandhi-loop-visualizer&quot;&gt;
                            &lt;div style=&quot;font-weight: 700; font-size: 13px; margin-bottom: 2px; color: var(--primary-color);&quot;&gt;🔄 Standard Tones Loop (非入聲變調環)&lt;/div&gt;

                    &lt;!-- Neutral Tone Section --&gt;
                    &lt;div class=&quot;guide-section&quot;&gt;
                        &lt;h2&gt;🍃 Neutral Tone &amp; Sandhi (輕聲與變調)&lt;/h2&gt;
                        &lt;p style=&quot;font-size: 14px; line-height: 1.5; color: var(--text-secondary);&quot;&gt;
                            In Taiwanese Hokkien, a **neutral tone (輕聲)** is represented by a double hyphen &lt;code&gt;--&lt;/code&gt; before the syllable (e.g., &lt;code&gt;khì--khì&lt;/code&gt;). Unlike standard sandhi:
                        &lt;/p&gt;
                        &lt;ul style=&quot;font-size: 13px; color: var(--text-secondary); margin-left: 20px; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; line-height: 1.5;&quot;&gt;
                            &lt;li&gt;&lt;strong&gt;Word 1 (Preceding word) does NOT change&lt;/strong&gt;: Under this grammatical condition, Word 1 retains its original &lt;strong&gt;base tone&lt;/strong&gt; (本調) instead of standard sandhi.&lt;/li&gt;
                            &lt;li&gt;&lt;strong&gt;Word 2 is pronounced softly&lt;/strong&gt;: It is spoken low and short. The trainer automatically softens and speeds up the audio for neutral tones.&lt;/li&gt;
                            &lt;li&gt;&lt;strong&gt;Quick Type support&lt;/strong&gt;: You can check the &quot;Neutral Tone&quot; box, or type &lt;code&gt;--&lt;/code&gt; before Word 2 (e.g. &lt;code&gt;--khì&lt;/code&gt; or &lt;code&gt;--khi3&lt;/code&gt;) to trigger the rule automatically.&lt;/li&gt;
                        &lt;/ul&gt;
                    &lt;/div&gt;

                    &lt;!-- Triplicate Section --&gt;
                    &lt;div class=&quot;guide-section&quot;&gt;
                        &lt;h2&gt;🔄 Triplicate Sandhi (三字疊字變調 AAA)&lt;/h2&gt;
                        &lt;p style=&quot;font-size: 14px; line-height: 1.5; color: var(--text-secondary);&quot;&gt;
                            In Taiwanese Hokkien, when an adjective is triplicated (AAA structure) for emphasis (e.g., &lt;code&gt;âng-âng-âng&lt;/code&gt; 紅紅紅), a special sandhi rule applies:
                        &lt;/p&gt;
                        &lt;ul style=&quot;font-size: 13px; color: var(--text-secondary); margin-left: 20px; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; line-height: 1.5;&quot;&gt;
                            &lt;li&gt;&lt;strong&gt;Word 3 (Last word)&lt;/strong&gt;: retains its original &lt;strong&gt;base tone&lt;/strong&gt; (本調).&lt;/li&gt;
                            &lt;li&gt;&lt;strong&gt;Word 2 (Middle word)&lt;/strong&gt;: undergoes standard &lt;strong&gt;general tone sandhi&lt;/strong&gt; (一般變調).&lt;/li&gt;
                            &lt;li&gt;&lt;strong&gt;Word 1 (First word)&lt;/strong&gt;:
                                &lt;ul&gt;
                                    &lt;li&gt;If the base tone is &lt;strong&gt;1, 5, 7, or 8&lt;/strong&gt;: It changes to a &lt;strong&gt;mid-rising tone (中升調, T5)&lt;/strong&gt;. For entering Tone 8 ending in &lt;code&gt;-h&lt;/code&gt;, it also drops the glottal stop &lt;code&gt;-h&lt;/code&gt; and becomes Tone 5.&lt;/li&gt;
                                    &lt;li&gt;If the base tone is &lt;strong&gt;2, 3, or 4&lt;/strong&gt;: It undergoes standard &lt;strong&gt;general tone sandhi&lt;/strong&gt; (一般變調).&lt;/li&gt;
                                &lt;/ul&gt;
                            &lt;/li&gt;
                            &lt;li&gt;&lt;strong&gt;Auto-detection&lt;/strong&gt;: The trainer automatically detects when you input three identical syllables in 3-Syllable Mode and applies this triplicate sandhi rule.&lt;/li&gt;
                        &lt;/ul&gt;
                    &lt;/div&gt;

                    &lt;div class=&quot;guide-section&quot;&gt;
                        &lt;h2&gt;🎙️ Authentic Audio Engine&lt;/h2&gt;
                        &lt;div class=&quot;guide-grid&quot;&gt;
                            &lt;div class=&quot;guide-card&quot;&gt;

                                &lt;p style=&quot;color: var(--text-secondary);&quot;&gt;
                                    The trainer embeds a database of 1,855 unique Taiwanese syllables. When you press play, it streams real-person recordings from the MoE Taiwanese dictionary to play back-to-back.
                                &lt;/p&gt;
                            &lt;/div&gt;
                            &lt;div class=&quot;guide-card&quot;&gt;
                                &lt;h4&gt;🔄 Multi-stage Tone Fallback&lt;/h4&gt;
                                &lt;p style=&quot;color: var(--text-secondary);&quot;&gt;

                                &lt;/p&gt;
                            &lt;/div&gt;

    &lt;script&gt;

            8: { &#39;a&#39;: &#39;a\u030d&#39;, &#39;e&#39;: &#39;e\u030d&#39;, &#39;i&#39;: &#39;i\u030d&#39;, &#39;o&#39;: &#39;o\u030d&#39;, &#39;u&#39;: &#39;u\u030d&#39;, &#39;m&#39;: &#39;m\u030d&#39;, &#39;n&#39;: &#39;n\u030d&#39; }

16960(1)&quot;,&quot;siau7&quot;:&quot;17113(1)&quot;,&quot;jiang7&quot;:&quot;28264(1)&quot;,&quot;giang7&quot;:&quot;28264(1)&quot;,&quot;long7&quot;:&quot;29805(1)&quot;};

        // Determine if a rhyme is entering (ends in p, t, k, h)
        function isEnteringRhyme(rhyme) {
            return rhyme.endsWith(&#39;p&#39;) || rhyme.endsWith(&#39;t&#39;) || rhyme.endsWith(&#39;k&#39;) || rhyme.endsWith(&#39;h&#39;);
        }

        // Dynamically update Tone selector choices based on selected Rhyme
        function updateToneDropdown(wordNum) {
            const rhyme = document.getElementById(`rhyme${wordNum}`).value;
            const toneSelect = document.getElementById(`tone${wordNum}`);
            const currentVal = toneSelect.value;
            
            toneSelect.innerHTML = &quot;&quot;;
            
            if (isEnteringRhyme(rhyme)) {
                // Entering rhymes: Tones 4 and 8 only
                const opt4 = document.createElement(&quot;option&quot;);
                opt4.value = &quot;4&quot;;
                opt4.text = &quot;Tone 4 (入聲)&quot;;
                const opt8 = document.createElement(&quot;option&quot;);
                opt8.value = &quot;8&quot;;
                opt8.text = &quot;Tone 8 (入聲)&quot;;
                
                toneSelect.appendChild(opt4);
                toneSelect.appendChild(opt8);
                
                if (currentVal === &quot;4&quot; || currentVal === &quot;8&quot;) {
                    toneSelect.value = currentVal;
                } else {
                    toneSelect.value = &quot;4&quot;;
                }
            } else {
                // Non-entering rhymes: Tones 1, 2, 3, 5, 7
                const tones = [
                    { val: &quot;1&quot;, text: &quot;Tone 1 (高平)&quot; },
                    { val: &quot;2&quot;, text: &quot;Tone 2 (高降)&quot; },
                    { val: &quot;3&quot;, text: &quot;Tone 3 (低降)&quot; },
                    { val: &quot;5&quot;, text: &quot;Tone 5 (低升)&quot; },
                    { val: &quot;7&quot;, text: &quot;Tone 7 (中平)&quot; }
                ];
                
                tones.forEach(t =&gt; {
                    const opt = document.createElement(&quot;option&quot;);
                    opt.value = t.val;
                    opt.text = t.text;
                    toneSelect.appendChild(opt);
                });
                
                if ([&quot;1&quot;, &quot;2&quot;, &quot;3&quot;, &quot;5&quot;, &quot;7&quot;].includes(currentVal)) {
                    toneSelect.value = currentVal;
                } else {
                    toneSelect.value = &quot;1&quot;;
                }
            }
        }

        // Apply diacritic to a Tâi-lô syllable based on vowel priority
        function applyToneMark(initial, rhyme, tone) {
            const word = initial + rhyme;
            if (tone == 1 || tone == 4) return word; // Tone 1 and 4 have no mark
            
            let vowelToAccent = &quot;&quot;;
            
            if (rhyme.includes(&#39;a&#39;)) {
                vowelToAccent = &#39;a&#39;;
            } else if (rhyme.includes(&#39;o\u0358&#39;) || rhyme.includes(&#39;o͘&#39;)) {
                vowelToAccent = &#39;o&#39;;
            } else if (rhyme.includes(&#39;oo&#39;)) {
                vowelToAccent = &#39;o&#39;; // Accents go on first &#39;o&#39;
            } else if (rhyme.includes(&#39;e&#39;)) {
                vowelToAccent = &#39;e&#39;;
            } else if (rhyme.includes(&#39;o&#39;)) {
                vowelToAccent = &#39;o&#39;;
            } else if (rhyme.includes(&#39;i&#39;) &amp;&amp; rhyme.includes(&#39;u&#39;)) {
                // &#39;ui&#39; or &#39;iu&#39;: accent goes on the second vowel
                const idxI = rhyme.indexOf(&#39;i&#39;);
                const idxU = rhyme.indexOf(&#39;u&#39;);
                vowelToAccent = idxI &gt; idxU ? &#39;i&#39; : &#39;u&#39;;
            } else if (rhyme.includes(&#39;i&#39;)) {
                vowelToAccent = &#39;i&#39;;
            } else if (rhyme.includes(&#39;u&#39;)) {
                vowelToAccent = &#39;u&#39;;
            } else if (rhyme.includes(&#39;ng&#39;)) {
                vowelToAccent = &#39;n&#39;; // Syllabic nasal: accent goes on &#39;n&#39;
            } else if (rhyme.includes(&#39;m&#39;)) {
                vowelToAccent = &#39;m&#39;; // Syllabic nasal: accent goes on &#39;m&#39;
            }
            
            if (!vowelToAccent) return word;
            
            const accentMap = diacritics[tone];
            if (!accentMap || !accentMap[vowelToAccent]) return word;
            
            const accentedVowel = accentMap[vowelToAccent];
            
            if (rhyme.includes(&#39;oo&#39;) &amp;&amp; vowelToAccent === &#39;o&#39;) {
                const pos = word.indexOf(&#39;oo&#39;);
                if (pos !== -1) {
                    return word.slice(0, pos) + accentedVowel + &#39;o&#39; + word.slice(pos + 2);
                }
            }
            
            const lastIndex = word.lastIndexOf(vowelToAccent);
            if (lastIndex !== -1) {
                return word.slice(0, lastIndex) + accentedVowel + word.slice(lastIndex + 1);
            }
            
            return word;
        }

        // Calculate Tone Sandhi for Word 1
        function calculateSandhiSyllable(initial, rhyme, tone) {
            let sandhiInitial = initial;
            let sandhiRhyme = rhyme;
            let sandhiTone = tone;
            let ruleDesc = &quot;&quot;;
            
            switch(parseInt(tone)) {
                case 1:
                    sandhiTone = 7;
                    ruleDesc = &quot;Tone 1 (高平 55) ➔ Tone 7 (中平 33)&quot;;
                    break;
                case 2:
                    sandhiTone = 1;
                    ruleDesc = &quot;Tone 2 (高降 51) ➔ Tone 1 (高平 55)&quot;;
                    break;
                case 3:
                    sandhiTone = 2;
                    ruleDesc = &quot;Tone 3 (低降 21) ➔ Tone 2 (高降 51)&quot;;
                    break;
                case 4:
                    if (rhyme.endsWith(&#39;h&#39;)) {
                        // Drop -h and become Tone 2
                        sandhiRhyme = rhyme.slice(0, -1);
                        sandhiTone = 2;
                        ruleDesc = &quot;Tone 4 ending in -h ➔ drops -h and becomes Tone 2 (高降 51)&quot;;
                    } else {
                        // Ends in -p, -t, -k, becomes Tone 8
                        sandhiTone = 8;
                        ruleDesc = &quot;Tone 4 ending in -p/-t/-k ➔ becomes Tone 8 (高入 5)&quot;;
                    }
                    break;
                case 5:
                    sandhiTone = 7;
                    ruleDesc = &quot;Tone 5 (低升 24) ➔ Tone 7 (中平 33)&quot;;
                    break;
                case 7:
                    sandhiTone = 3;
                    ruleDesc = &quot;Tone 7 (中平 33) ➔ Tone 3 (低降 21)&quot;;
                    break;
                case 8:
                    if (rhyme.endsWith(&#39;h&#39;)) {
                        // Drop -h and become Tone 3
                        sandhiRhyme = rhyme.slice(0, -1);
                        sandhiTone = 3;
                        ruleDesc = &quot;Tone 8 ending in -h ➔ drops -h and becomes Tone 3 (低降 21)&quot;;
                    } else {
                        // Ends in -p, -t, -k, becomes Tone 4
                        sandhiTone = 4;
                        ruleDesc = &quot;Tone 8 ending in -p/-t/-k ➔ becomes Tone 4 (中入 3)&quot;;
                    }
                    break;
            }
            
            return { sandhiInitial, sandhiRhyme, sandhiTone, ruleDesc };
        }

        // Get Audio ID for sequential audio playback with multi-stage fallback
        function getAudioId(initial, rhyme, targetTone, baseTone) {
            let base = (initial + rhyme).toLowerCase();
            // Normalize spelling to ASCII-based keys in syllableAudioMap
            base = base.normalize(&#39;NFD&#39;).replace(/[\u0300-\u036f]/g, &#39;&#39;).normalize(&#39;NFC&#39;);
            base = base.replace(/o͘/g, &#39;oo&#39;).replace(/o•/g, &#39;oo&#39;).replace(/ⁿ/g, &#39;nn&#39;);
            
            // 1. Try exact target tone (sandhi tone)
            let key = base + targetTone;
            if (syllableAudioMap[key]) return { id: syllableAudioMap[key], matchType: &#39;target&#39; };
            
            // 2. Try the base tone of the syllable
            if (baseTone) {
                key = base + baseTone;
                if (syllableAudioMap[key]) return { id: syllableAudioMap[key], matchType: &#39;base_fallback&#39; };
            }
            
            // 3. Try any other tone (1, 2, 3, 5, 7, 8, 4)
            const fallbackTones = [1, 2, 3, 5, 7, 8, 4];
            for (let t of fallbackTones) {
                key = base + t;
                if (syllableAudioMap[key]) return { id: syllableAudioMap[key], matchType: &#39;any_fallback&#39; };
            }
            
            return { id: null, matchType: &#39;none&#39; };
        }

        // Parse user-typed Lô-má-jī syllable
        function parseSyllableText(str) {
            let s = str.toLowerCase().trim();
            if (!s) return null;
            
            // Detect neutral tone &quot;--&quot; prefix for Word 2
            let isNeutral = false;
            if (s.startsWith(&#39;--&#39;)) {
                isNeutral = true;
                s = s.slice(2);
            }
            
            // 1. Detect Tone
            let tone = null;
            const matchDigit = s.match(/([1-8])$/);
            if (matchDigit) {
                tone = parseInt(matchDigit[1]);
                s = s.slice(0, -1);
            } else {
                const nfd = s.normalize(&#39;NFD&#39;);
                if (nfd.includes(&#39;\u0301&#39;) || /[áéíóúḿń]/.test(s)) tone = 2;
                else if (nfd.includes(&#39;\u0300&#39;) || /[àèìòùǹ]/.test(s)) tone = 3;
                else if (nfd.includes(&#39;\u0302&#39;) || /[âêîôû]/.test(s)) tone = 5;
                else if (nfd.includes(&#39;\u0304&#39;) || /[āēīōū]/.test(s)) tone = 7;
                else if (nfd.includes(&#39;\u030d&#39;) || s.includes(&#39;̍&#39;)) tone = 8;
            }
            
            // 2. Normalize to base spelling (ASCII)
            let base = s.normalize(&#39;NFD&#39;).replace(/[\u0300-\u036f]/g, &#39;&#39;).normalize(&#39;NFC&#39;);
            base = base.replace(/o͘/g, &#39;oo&#39;).replace(/o•/g, &#39;oo&#39;).replace(/ⁿ/g, &#39;nn&#39;);
            
            // Resolve Entering Tones (T4/T8) if no tone found yet
            if (tone === null) {
                if (base.endsWith(&#39;p&#39;) || base.endsWith(&#39;t&#39;) || base.endsWith(&#39;k&#39;) || base.endsWith(&#39;h&#39;)) {
                    if (s.normalize(&#39;NFD&#39;).includes(&#39;\u030d&#39;) || s.includes(&#39;̍&#39;)) {
                        tone = 8;
                    } else {
                        tone = 4;
                    }
                } else {
                    tone = 1;
                }
            }
            
            // 3. Separate Initial and Rhyme
            const initials = [&#39;tsh&#39;, &#39;ts&#39;, &#39;kh&#39;, &#39;ph&#39;, &#39;th&#39;, &#39;ng&#39;, &#39;ch&#39;, &#39;chh&#39;, &#39;b&#39;, &#39;g&#39;, &#39;h&#39;, &#39;j&#39;, &#39;k&#39;, &#39;l&#39;, &#39;m&#39;, &#39;n&#39;, &#39;p&#39;, &#39;s&#39;, &#39;t&#39;];
            let initial = &quot;&quot;;
            let rhymePart = base;
            
            for (let init of initials) {
                if (base.startsWith(init)) {
                    initial = init;
                    rhymePart = base.slice(init.length);
                    break;
                }
            }
            
            if (initial === &#39;ch&#39;) initial = &#39;ts&#39;;
            if (initial === &#39;chh&#39;) initial = &#39;tsh&#39;;
            
            // 4. Map rhyme spelling to dropdown option values
            const rhymeMap = {
                &#39;ann&#39;: &#39;aⁿ&#39;, &#39;enn&#39;: &#39;eⁿ&#39;, &#39;inn&#39;: &#39;iⁿ&#39;, &#39;oonn&#39;: &#39;o͘ⁿ&#39;, &#39;onn&#39;: &#39;oⁿ&#39;,
                &#39;uann&#39;: &#39;uaⁿ&#39;, &#39;uinn&#39;: &#39;uiⁿ&#39;, &#39;uenn&#39;: &#39;ueⁿ&#39;, &#39;iaunn&#39;: &#39;iauⁿ&#39;,
                &#39;iann&#39;: &#39;iaⁿ&#39;, &#39;iunn&#39;: &#39;iuⁿ&#39;, &#39;ainn&#39;: &#39;aiⁿ&#39;, &#39;uainn&#39;: &#39;uaiⁿ&#39;,
                &#39;annh&#39;: &#39;aⁿh&#39;, &#39;ennh&#39;: &#39;eⁿh&#39;, &#39;iannh&#39;: &#39;iaⁿh&#39;,
                &#39;o͘&#39;: &#39;oo&#39;, &#39;o•&#39;: &#39;oo&#39;,
                &#39;oa&#39;: &#39;ua&#39;, &#39;oe&#39;: &#39;ue&#39;, &#39;oai&#39;: &#39;uai&#39;, &#39;oan&#39;: &#39;uan&#39;, &#39;oat&#39;: &#39;uat&#39;, &#39;oah&#39;: &#39;uah&#39;,
                &#39;oann&#39;: &#39;uaⁿ&#39;, &#39;oenn&#39;: &#39;ueⁿ&#39;, &#39;oainn&#39;: &#39;uaiⁿ&#39;, &#39;oannh&#39;: &#39;uaⁿh&#39;
            };
            
            let rhyme = rhymeMap[rhymePart] || rhymePart;
            
            return { initial, rhyme, tone, isNeutral };
        }

        // Sync visual dropdown selectors with text inputs
        let activeWordCount = 2;
        let fourSyllableStructure = &#39;sequential&#39;; // &#39;sequential&#39; or &#39;split&#39;

        // Set active word count mode
        function setWordCount(count) {
            activeWordCount = count;
            
            // Toggle active classes on mode buttons
            document.querySelectorAll(&#39;.mode-btn&#39;).forEach(btn =&gt; {
                if (btn.id.startsWith(&#39;mode-btn-&#39;)) {
                    btn.classList.remove(&#39;active&#39;);
                }
            });
            const activeBtn = document.getElementById(`mode-btn-${count}`);
            if (activeBtn) activeBtn.classList.add(&#39;active&#39;);

            document.getElementById(&#39;card-3&#39;).style.display = count &gt;= 3 ? &#39;block&#39; : &#39;none&#39;;
            document.getElementById(&#39;card-4&#39;).style.display = count &gt;= 4 ? &#39;block&#39; : &#39;none&#39;;
            
            // Update grid columns class
            const gridLayout = document.querySelector(&#39;.grid-layout&#39;);
            gridLayout.classList.remove(&#39;cols-2&#39;, &#39;cols-3&#39;, &#39;cols-4&#39;);
            gridLayout.classList.add(`cols-${count}`);
            
            // Show/hide structure selector for 4-syllable mode
            const structSelect = document.getElementById(&#39;structure-selector-container&#39;);
            if (count === 4) {
                structSelect.style.display = &#39;flex&#39;;
            } else {
                structSelect.style.display = &#39;none&#39;;
            }
            
            // Toggle visibility of neutral checkboxes so only the last one is shown/functional
            if (document.getElementById(&#39;neutral-container-2&#39;)) {
                document.getElementById(&#39;neutral-container-2&#39;).style.display = count === 2 ? &#39;flex&#39; : &#39;none&#39;;
            }
            if (document.getElementById(&#39;neutral-container-3&#39;)) {
                document.getElementById(&#39;neutral-container-3&#39;).style.display = count === 3 ? &#39;flex&#39; : &#39;none&#39;;
            }
            if (document.getElementById(&#39;neutral-container-4&#39;)) {
                document.getElementById(&#39;neutral-container-4&#39;).style.display = count === 4 ? &#39;flex&#39; : &#39;none&#39;;
            }
            
            // Reset neutral checkbox values of non-last elements to false to prevent hidden states affecting calculations
            for (let i = 2; i &lt;= 4; i++) {
                const box = document.getElementById(`neutral${i}`);
                if (box &amp;&amp; i !== count) {
                    box.checked = false;
                }
            }
            
            calculateSandhi();
        }

        // Set structure mode for 4-syllable mode
        function setFourSyllableStructure(struct) {
            fourSyllableStructure = struct;
            document.getElementById(&#39;struct-btn-seq&#39;).classList.toggle(&#39;active&#39;, struct === &#39;sequential&#39;);
            document.getElementById(&#39;struct-btn-split&#39;).classList.toggle(&#39;active&#39;, struct === &#39;split&#39;);
            calculateSandhi();
        }

        function onTextInput(wordNum) {
            const val = document.getElementById(`text${wordNum}`).value.trim();
            if (!val) return;
            
            const parsed = parseSyllableText(val);
            if (parsed) {
                const initSelect = document.getElementById(`init${wordNum}`);
                const rhymeSelect = document.getElementById(`rhyme${wordNum}`);
                const toneSelect = document.getElementById(`tone${wordNum}`);
                
                if (initSelect.querySelector(`option[value=&quot;${parsed.initial}&quot;]`)) {
                    initSelect.value = parsed.initial;
                }
                
                if (rhymeSelect.querySelector(`option[value=&quot;${parsed.rhyme}&quot;]`)) {
                    rhymeSelect.value = parsed.rhyme;
                    updateToneDropdown(wordNum);
                }
                
                if (toneSelect.querySelector(`option[value=&quot;${parsed.tone}&quot;]`)) {
                    toneSelect.value = parsed.tone;
                }
                
                const neutralBox = document.getElementById(`neutral${wordNum}`);
                if (neutralBox) {
                    neutralBox.checked = parsed.isNeutral;
                }
                
                calculateSandhi();
            }
        }

        // Update Text Input based on dropdowns (skip if text box is focused)
        function updateTextInput(wordNum) {
            const textInput = document.getElementById(`text${wordNum}`);
            if (document.activeElement === textInput) return; // Don&#39;t overwrite active typing
            
            const init = document.getElementById(`init${wordNum}`).value;
            const rhyme = document.getElementById(`rhyme${wordNum}`).value;
            const tone = document.getElementById(`tone${wordNum}`).value;
            if (!tone) return;
            
            let spelling = applyToneMark(init, rhyme, tone);
            const neutralBox = document.getElementById(`neutral${wordNum}`);
            if (neutralBox &amp;&amp; neutralBox.checked) {
                spelling = &#39;--&#39; + spelling;
            }
            textInput.value = spelling;
        }
        
        function onNeutralChange() {
            calculateSandhi();
        }

        // Core logic to calculate sandhi for multiple syllables
        function calculateMultiSandhi(words) {
            const results = [];
            const N = words.length;
            
            // Copy base values
            for (let i = 0; i &lt; N; i++) {
                results.push({
                    init: words[i].init,
                    rhyme: words[i].rhyme,
                    tone: words[i].tone,
                    isNeutral: words[i].isNeutral,
                    changed: false,
                    ruleDesc: &quot;Retains base tone (本調)&quot;
                });
            }
            
            const lastWord = words[N - 1];
            const isLastNeutral = lastWord.isNeutral;
            
            // Check for 3-Syllable Triplicate (三字疊字)
            const isTriplicate = (N === 3 &amp;&amp;
                words[0].init === words[1].init &amp;&amp; words[0].rhyme === words[1].rhyme &amp;&amp; words[0].tone === words[1].tone &amp;&amp;
                words[1].init === words[2].init &amp;&amp; words[1].rhyme === words[2].rhyme &amp;&amp; words[1].tone === words[2].tone &amp;&amp;
                !words[0].isNeutral &amp;&amp; !words[1].isNeutral &amp;&amp; !words[2].isNeutral);
            
            if (isTriplicate) {
                // Triplicate AAA rules
                // Word 3 (index 2) retains base tone
                results[2].changed = false;
                results[2].ruleDesc = &quot;三字疊字末字保持本調&quot;;
                
                // Word 2 (index 1) undergoes standard sandhi
                const sandhi2 = calculateSandhiSyllable(words[1].init, words[1].rhyme, words[1].tone);
                results[1].init = sandhi2.sandhiInitial;
                results[1].rhyme = sandhi2.sandhiRhyme;
                results[1].tone = sandhi2.sandhiTone;
                results[1].changed = true;
                results[1].ruleDesc = sandhi2.ruleDesc + &quot; (三字疊字中字照一般變調)&quot;;
                
                // Word 1 (index 0) undergoes triplicate sandhi
                const baseToneNum = parseInt(words[0].tone);
                if (baseToneNum === 1 || baseToneNum === 5 || baseToneNum === 7 || baseToneNum === 8) {
                    results[0].tone = 5;
                    results[0].changed = true; // T5 to T5 is still a sandhi change in contour
                    
                    let ruleStr = &quot;&quot;;
                    switch(baseToneNum) {
                        case 1: ruleStr = &quot;Tone 1 ➔ Tone 5 (中升調)&quot;; break;
                        case 5: ruleStr = &quot;Tone 5 ➔ Tone 5 (中升調)&quot;; break;
                        case 7: ruleStr = &quot;Tone 7 ➔ Tone 5 (中升調)&quot;; break;
                        case 8: ruleStr = &quot;Tone 8 ➔ Tone 5 (中升調)&quot;; break;
                    }
                    ruleStr += &quot; [三字疊字首字變調]&quot;;
                    
                    // Drop -h for entering glottal stop Tone 8
                    if (baseToneNum === 8 &amp;&amp; words[0].rhyme.endsWith(&#39;h&#39;)) {
                        results[0].rhyme = words[0].rhyme.slice(0, -1);
                        ruleStr += &quot;，且脫落喉塞音 -h&quot;;
                    }
                    
                    results[0].ruleDesc = ruleStr;
                } else {
                    // Tone 2, 3, 4 undergo standard sandhi
                    const sandhi1 = calculateSandhiSyllable(words[0].init, words[0].rhyme, words[0].tone);
                    results[0].init = sandhi1.sandhiInitial;
                    results[0].rhyme = sandhi1.sandhiRhyme;
                    results[0].tone = sandhi1.sandhiTone;
                    results[0].changed = true;
                    results[0].ruleDesc = sandhi1.ruleDesc + &quot; (三字疊字首字照一般變調)&quot;;
                }
            } else if (N === 4 &amp;&amp; fourSyllableStructure === &#39;split&#39;) {
                // 2+2 split structure: (1➔2) + (3➔4)
                // Word 1 (sandhi)
                const sandhi1 = calculateSandhiSyllable(words[0].init, words[0].rhyme, words[0].tone);
                results[0].init = sandhi1.sandhiInitial;
                results[0].rhyme = sandhi1.sandhiRhyme;
                results[0].tone = sandhi1.sandhiTone;
                results[0].changed = true;
                results[0].ruleDesc = sandhi1.ruleDesc;
                
                // Word 3 (sandhi)
                if (isLastNeutral) {
                    results[2].ruleDesc = &quot;Word 4 is neutral, so Word 3 retains base tone (本調)&quot;;
                } else {
                    const sandhi3 = calculateSandhiSyllable(words[2].init, words[2].rhyme, words[2].tone);
                    results[2].init = sandhi3.sandhiInitial;
                    results[2].rhyme = sandhi3.sandhiRhyme;
                    results[2].tone = sandhi3.sandhiTone;
                    results[2].changed = true;
                    results[2].ruleDesc = sandhi3.ruleDesc;
                }
            } else {
                // Sequential structure: 1 ➔ 2 ➔ ... ➔ N
                if (isLastNeutral) {
                    // Word N-2 retains base tone
                    results[N - 2].ruleDesc = `Word ${N} is neutral, so Word ${N-1} retains base tone (本調)`;
                    
                    for (let i = 0; i &lt; N - 2; i++) {
                        const sandhi = calculateSandhiSyllable(words[i].init, words[i].rhyme, words[i].tone);
                        results[i].init = sandhi.sandhiInitial;
                        results[i].rhyme = sandhi.sandhiRhyme;
                        results[i].tone = sandhi.sandhiTone;
                        results[i].changed = true;
                        results[i].ruleDesc = sandhi.ruleDesc;
                    }
                } else {
                    // Normal sequential
                    for (let i = 0; i &lt; N - 1; i++) {
                        const sandhi = calculateSandhiSyllable(words[i].init, words[i].rhyme, words[i].tone);
                        results[i].init = sandhi.sandhiInitial;
                        results[i].rhyme = sandhi.sandhiRhyme;
                        results[i].tone = sandhi.sandhiTone;
                        results[i].changed = true;
                        results[i].ruleDesc = sandhi.ruleDesc;
                    }
                }
            }
            
            return results;
        }

        // Main Calculation Function for N words
        function calculateSandhi() {
            const words = [];
            for (let i = 1; i &lt;= activeWordCount; i++) {
                words.push({
                    init: document.getElementById(`init${i}`).value,
                    rhyme: document.getElementById(`rhyme${i}`).value,
                    tone: document.getElementById(`tone${i}`).value,
                    isNeutral: document.getElementById(`neutral${i}`) ? document.getElementById(`neutral${i}`).checked : false
                });
            }
            
            if (words.some(w =&gt; !w.tone)) return;
            
            // Sync text inputs
            for (let i = 1; i &lt;= activeWordCount; i++) {
                updateTextInput(i);
            }
            
            // Update preview pills
            for (let i = 1; i &lt;= activeWordCount; i++) {
                const spelling = applyToneMark(words[i-1].init, words[i-1].rhyme, words[i-1].tone);
                const isN = words[i-1].isNeutral;
                document.getElementById(`preview${i}`).innerText = `${isN ? &#39;--&#39; : &#39;&#39;}${spelling} (T${words[i-1].tone}${isN ? &#39; 輕聲&#39; : &#39;&#39;})`;
            }
            
            // Calculate multi-word sandhi
            const finalWords = calculateMultiSandhi(words);
            
            // Rebuild flow-display dynamically
            const flowDisplay = document.querySelector(&#39;.flow-display&#39;);
            flowDisplay.innerHTML = &quot;&quot;;
            
            // 1. Base flow
            for (let i = 0; i &lt; activeWordCount; i++) {
                if (i &gt; 0) {
                    const plus = document.createElement(&#39;div&#39;);
                    plus.className = &#39;arrow-indicator&#39;;
                    plus.innerText = &#39;+&#39;;
                    flowDisplay.appendChild(plus);
                }
                const pill = document.createElement(&#39;div&#39;);
                pill.className = &#39;syllable-pill&#39;;
                const spelling = applyToneMark(words[i].init, words[i].rhyme, words[i].tone);
                pill.innerText = `${words[i].isNeutral ? &#39;--&#39; : &#39;&#39;}${spelling} (T${words[i].tone})`;
                flowDisplay.appendChild(pill);
            }
            
            // 2. Arrow
            const arrow = document.createElement(&#39;div&#39;);
            arrow.className = &#39;arrow-indicator&#39;;
            arrow.innerText = &#39;➔&#39;;
            flowDisplay.appendChild(arrow);
            
            // 3. Final sandhi flow
            for (let i = 0; i &lt; activeWordCount; i++) {
                if (i &gt; 0) {
                    const plus = document.createElement(&#39;div&#39;);
                    plus.className = &#39;arrow-indicator&#39;;
                    plus.innerText = &#39;+&#39;;
                    flowDisplay.appendChild(plus);
                }
                const pill = document.createElement(&#39;div&#39;);
                pill.className = &#39;syllable-pill&#39;;
                if (finalWords[i].changed) {
                    pill.className += &#39; changed&#39;;
                }
                const spelling = applyToneMark(finalWords[i].init, finalWords[i].rhyme, finalWords[i].tone);
                pill.innerText = `${finalWords[i].isNeutral ? &#39;--&#39; : &#39;&#39;}${spelling} (${finalWords[i].changed ? &#39;➔&#39; : &#39;&#39;}T${finalWords[i].tone})`;
                flowDisplay.appendChild(pill);
            }
            
            // Rebuild explanation text
            const lastWord = words[activeWordCount - 1];
            const isLastNeutral = lastWord.isNeutral;
            let expHtml = &quot;&quot;;
            
            // Check for 3-Syllable Triplicate (三字疊字)
            const isTriplicate = (activeWordCount === 3 &amp;&amp;
                words[0].init === words[1].init &amp;&amp; words[0].rhyme === words[1].rhyme &amp;&amp; words[0].tone === words[1].tone &amp;&amp;
                words[1].init === words[2].init &amp;&amp; words[1].rhyme === words[2].rhyme &amp;&amp; words[1].tone === words[2].tone &amp;&amp;
                !words[0].isNeutral &amp;&amp; !words[1].isNeutral &amp;&amp; !words[2].isNeutral);
            
            if (activeWordCount === 4 &amp;&amp; fourSyllableStructure === &#39;split&#39;) {
                expHtml += `&lt;strong&gt;四字兩兩變調結構 (2+2 Split Structure):&lt;/strong&gt;&lt;br&gt;`;
                const s1Base = applyToneMark(words[0].init, words[0].rhyme, words[0].tone);
                const s1Sandhi = applyToneMark(finalWords[0].init, finalWords[0].rhyme, finalWords[0].tone);
                const s2Base = applyToneMark(words[1].init, words[1].rhyme, words[1].tone);
                const s3Base = applyToneMark(words[2].init, words[2].rhyme, words[2].tone);
                const s3Sandhi = applyToneMark(finalWords[2].init, finalWords[2].rhyme, finalWords[2].tone);
                const s4Base = applyToneMark(words[3].init, words[3].rhyme, words[3].tone);
                
                expHtml += `第一組: &lt;strong&gt;${s1Base} (T${words[0].tone})&lt;/strong&gt; 變調為 &lt;strong&gt;${s1Sandhi} (T${finalWords[0].tone})&lt;/strong&gt;，&lt;strong&gt;${s2Base} (T${words[1].tone})&lt;/strong&gt; 保持本調。&lt;br&gt;`;
                if (isLastNeutral) {
                    expHtml += `第二組: 末字為輕聲，所以 &lt;strong&gt;${s3Base} (T${words[2].tone})&lt;/strong&gt; 保持本調，&lt;strong&gt;--${s4Base}&lt;/strong&gt; 讀輕聲。&lt;br&gt;`;
                    expHtml += `組合讀音: &lt;strong&gt;${s1Sandhi}-${s2Base} ${s3Base}--\u200B${s4Base}&lt;/strong&gt;`;
                } else {
                    expHtml += `第二組: &lt;strong&gt;${s3Base} (T${words[2].tone})&lt;/strong&gt; 變調為 &lt;strong&gt;${s3Sandhi} (T${finalWords[2].tone})&lt;/strong&gt;，&lt;strong&gt;${s4Base} (T${words[3].tone})&lt;/strong&gt; 保持本調。&lt;br&gt;`;
                    expHtml += `組合讀音: &lt;strong&gt;${s1Sandhi}-${s2Base} ${s3Sandhi}-${s4Base}&lt;/strong&gt;`;
                }
            } else if (isTriplicate) {
                expHtml += `&lt;strong&gt;三字疊字變調結構 (Triplicate AAA Sandhi):&lt;/strong&gt;&lt;br&gt;`;
                expHtml += `檢測到三連音疊字結構。規則為：末字（第 3 字）保持本調；中字（第 2 字）依規律進行一般變調；首字（第 1 字）若為 1, 5, 7, 8 聲，則變調為「中升調 (T5)」；若為 2, 3, 4 聲，則照一般規律變調。&lt;br&gt;`;
                
                // Detail each word change
                let finalSpellingParts = [];
                for (let i = 0; i &lt; activeWordCount; i++) {
                    const baseSpelling = applyToneMark(words[i].init, words[i].rhyme, words[i].tone);
                    const finalSpelling = applyToneMark(finalWords[i].init, finalWords[i].rhyme, finalWords[i].tone);
                    
                    if (finalWords[i].changed) {
                        expHtml += `第 ${i+1} 字: &lt;strong&gt;${baseSpelling} (T${words[i].tone})&lt;/strong&gt; 變為 &lt;strong&gt;${finalSpelling} (T${finalWords[i].tone})&lt;/strong&gt; (${finalWords[i].ruleDesc})&lt;br&gt;`;
                        finalSpellingParts.push(finalSpelling);
                    } else {
                        expHtml += `第 ${i+1} 字: &lt;strong&gt;${finalSpelling} (T${finalWords[i].tone})&lt;/strong&gt; 保持本調&lt;br&gt;`;
                        finalSpellingParts.push(finalSpelling);
                    }
                }
                
                // Show combined spelling
                let combinedStr = finalSpellingParts.join(&#39;-&#39;);
                expHtml += `組合讀音: &lt;strong&gt;${combinedStr}&lt;/strong&gt;`;
            } else {
                expHtml += `&lt;strong&gt;${activeWordCount}字連讀變調 (Sequential Sandhi):&lt;/strong&gt;&lt;br&gt;`;
                if (isLastNeutral) {
                    expHtml += `末字為輕聲 (以 &lt;code&gt;--&lt;/code&gt; 標示)。在此語法條件下，前一個字 &lt;strong&gt;${applyToneMark(words[activeWordCount-2].init, words[activeWordCount-2].rhyme, words[activeWordCount-2].tone)} (T${words[activeWordCount-2].tone})&lt;/strong&gt; 保持本調 (本調)，而更前面的字皆須變調。&lt;br&gt;`;
                } else {
                    expHtml += `最後一個音節保持本調 (本調)，其餘前面的音節皆須依規律變調。&lt;br&gt;`;
                }
                
                // Detail each word change
                let finalSpellingParts = [];
                for (let i = 0; i &lt; activeWordCount; i++) {
                    const baseSpelling = applyToneMark(words[i].init, words[i].rhyme, words[i].tone);
                    const finalSpelling = applyToneMark(finalWords[i].init, finalWords[i].rhyme, finalWords[i].tone);
                    
                    if (finalWords[i].changed) {
                        expHtml += `第 ${i+1} 字: &lt;strong&gt;${baseSpelling} (T${words[i].tone})&lt;/strong&gt; 變為 &lt;strong&gt;${finalSpelling} (T${finalWords[i].tone})&lt;/strong&gt; (${finalWords[i].ruleDesc})&lt;br&gt;`;
                        finalSpellingParts.push(finalSpelling);
                    } else if (finalWords[i].isNeutral) {
                        expHtml += `第 ${i+1} 字: &lt;strong&gt;--${finalSpelling}&lt;/strong&gt; 讀輕聲&lt;br&gt;`;
                        finalSpellingParts.push(&#39;--&#39; + finalSpelling);
                    } else {
                        expHtml += `第 ${i+1} 字: &lt;strong&gt;${finalSpelling} (T${finalWords[i].tone})&lt;/strong&gt; 保持本調&lt;br&gt;`;
                        finalSpellingParts.push(finalSpelling);
                    }
                }
                
                // Show combined spelling
                let combinedStr = &quot;&quot;;
                for (let i = 0; i &lt; activeWordCount; i++) {
                    if (i &gt; 0) {
                        if (finalSpellingParts[i].startsWith(&#39;--&#39;)) {
                            combinedStr += &#39;&#39;;
                        } else {
                            combinedStr += &#39;-&#39;;
                        }
                    }
                    combinedStr += finalSpellingParts[i];
                }
                expHtml += `組合讀音: &lt;strong&gt;${combinedStr}&lt;/strong&gt;`;
            }
            
            // Check for audio fallbacks and append detailed warning
            let fallbackNotes = [];
            for (let i = 0; i &lt; activeWordCount; i++) {
                const audioObj = getAudioId(finalWords[i].init, finalWords[i].rhyme, finalWords[i].tone, words[i].tone);
                if (audioObj.id &amp;&amp; (audioObj.matchType === &#39;base_fallback&#39; || audioObj.matchType === &#39;any_fallback&#39;)) {
                    const spelling = applyToneMark(finalWords[i].init, finalWords[i].rhyme, finalWords[i].tone);
                    const baseSpelling = applyToneMark(words[i].init, words[i].rhyme, words[i].tone);
                    fallbackNotes.push(`第 ${i+1} 字「${baseSpelling}」變調為 &lt;strong&gt;${spelling} (T${finalWords[i].tone})&lt;/strong&gt;，但教育部語音庫中無此變調單音檔，將以降級本調 &lt;strong&gt;${baseSpelling} (T${words[i].tone})&lt;/strong&gt; 播放。`);
                }
            }
            
            if (fallbackNotes.length &gt; 0) {
                expHtml += `&lt;div class=&quot;fallback-warning-box&quot;&gt;`;
                expHtml += `⚠️ &lt;strong&gt;語音播放提示 (Audio Fallback Notice)：&lt;/strong&gt;&lt;br&gt;`;
                fallbackNotes.forEach(note =&gt; {
                    expHtml += `• ${note}&lt;br&gt;`;
                });
                expHtml += `&lt;/div&gt;`;
            }
            
            document.getElementById(&#39;explanation-box&#39;).innerHTML = expHtml;
            
            updateSpeechBadge(words, finalWords);
        }
        
        function updateSpeechBadge(words, finalWords) {
            const badge = document.getElementById(&#39;speech-engine-badge&#39;);
            
            let missingCount = 0;
            let availableCount = 0;
            let hasFallback = false;
            
            for (let i = 0; i &lt; activeWordCount; i++) {
                const audioObj = getAudioId(finalWords[i].init, finalWords[i].rhyme, finalWords[i].tone, words[i].tone);
                if (audioObj.id) {
                    availableCount++;
                    if (audioObj.matchType !== &#39;target&#39;) {
                        hasFallback = true;
                    }
                } else {
                    missingCount++;
                }
            }
            
            if (missingCount === 0) {
                if (hasFallback) {
                    badge.innerText = &quot;🔊 MoE Audio (部份音節使用本調)&quot;;
                } else {
                    badge.innerText = &quot;🔊 MoE Audio (教育部真人口音)&quot;;
                }
                badge.classList.remove(&#39;fallback&#39;);
            } else if (availableCount &gt; 0) {
                badge.innerText = &quot;⚠️ Partial MoE Audio (部份音檔缺損)&quot;;
                badge.classList.add(&#39;fallback&#39;);
            } else {
                badge.innerText = &quot;⚠️ Audio Unavailable (無此羅馬字音檔)&quot;;
                badge.classList.add(&#39;fallback&#39;);
            }
        }

        let activeAudio = null;
        let activeAudioQueue = [];
        let currentQueueIndex = 0;

        // Sequential Audio Queue Player (N words)
        function playAudioSequence(audioIds) {
            if (activeAudio) {
                activeAudio.pause();
                activeAudio = null;
            }
            
            activeAudioQueue = audioIds;
            currentQueueIndex = 0;
            const speed = parseFloat(document.getElementById(&#39;speed-rate&#39;).value) || 0.8;
            
            function playNext() {
                if (currentQueueIndex &gt;= activeAudioQueue.length) return;
                
                const id = activeAudioQueue[currentQueueIndex];
                
                if (!id) {
                    currentQueueIndex++;
                    playNext();
                    return;
                }
                
                const cdnUrl = `https://chhoetaigi.github.io/KipSutianDataMirror/public/20260503-2330/imtong/sutiau/${id}.mp3`;
                
                activeAudio = new Audio(cdnUrl);
                
                const isNeutral = document.getElementById(`neutral${currentQueueIndex + 1}`) ? 
                    document.getElementById(`neutral${currentQueueIndex + 1}`).checked : false;
                
                if (isNeutral) {
                    activeAudio.volume = 0.55;            // Quieter volume for neutral tone
                    activeAudio.playbackRate = speed * 1.25; // Faster playback for short/soft sound
                } else {
                    activeAudio.playbackRate = speed;
                }
                
                activeAudio.onended = () =&gt; {
                    currentQueueIndex++;
                    playNext();
                };
                
                activeAudio.onerror = (e) =&gt; {
                    console.warn(`Play failed for ID ${id}`, e);
                    currentQueueIndex++;
                    playNext();
                };
                
                activeAudio.play().catch(err =&gt; {
                    console.warn(`Play failed for ID ${id}`, err);
                    currentQueueIndex++;
                    playNext();
                });
            }
            
            playNext();
        }

        // Speak trigger (N words)
        function triggerSpeech() {
            const words = [];
            for (let i = 1; i &lt;= activeWordCount; i++) {
                words.push({
                    init: document.getElementById(`init${i}`).value,
                    rhyme: document.getElementById(`rhyme${i}`).value,
                    tone: document.getElementById(`tone${i}`).value,
                    isNeutral: document.getElementById(`neutral${i}`) ? document.getElementById(`neutral${i}`).checked : false
                });
            }
            
            if (words.some(w =&gt; !w.tone)) return;
            
            const finalWords = calculateMultiSandhi(words);
            
            const audioIds = [];
            const missingInfo = [];
            let hasFallback = false;
            
            for (let i = 0; i &lt; activeWordCount; i++) {
                const audioObj = getAudioId(finalWords[i].init, finalWords[i].rhyme, finalWords[i].tone, words[i].tone);
                const spelling = applyToneMark(finalWords[i].init, finalWords[i].rhyme, finalWords[i].tone);
                if (audioObj.id) {
                    audioIds.push(audioObj.id);
                    if (audioObj.matchType !== &#39;target&#39;) {
                        hasFallback = true;
                    }
                } else {
                    audioIds.push(null);
                    missingInfo.push(`第 ${i+1} 字 (${finalWords[i].isNeutral ? &#39;--&#39; : &#39;&#39;}${spelling})`);
                }
            }
            
            const badge = document.getElementById(&#39;speech-engine-badge&#39;);
            
            if (missingInfo.length === 0) {
                if (hasFallback) {
                    badge.innerText = &quot;🔊 Playing MoE Audio (部份音節使用本調)&quot;;
                } else {
                    badge.innerText = &quot;🔊 Playing MoE Audio (教育部真人口音)&quot;;
                }
                badge.classList.remove(&#39;fallback&#39;);
                playAudioSequence(audioIds);
            } else if (missingInfo.length &lt; activeWordCount) {
                badge.innerText = `⚠️ Missing audio for: ${missingInfo.join(&#39;, &#39;)}`;
                badge.classList.add(&#39;fallback&#39;);
                playAudioSequence(audioIds);
            } else {
                badge.innerText = &quot;⚠️ All syllables audio missing&quot;;
                badge.classList.add(&#39;fallback&#39;);
            }
        }

        // Tab Switcher
        function switchTab(tabId) {
            document.querySelectorAll(&#39;.tab-btn&#39;).forEach(btn =&gt; btn.classList.remove(&#39;active&#39;));
            document.querySelectorAll(&#39;.tab-content&#39;).forEach(content =&gt; content.classList.remove(&#39;active&#39;));
            
            if (tabId === &#39;trainer&#39;) {
                document.querySelector(&#39;.tab-btn[onclick=&quot;switchTab(\&#39;trainer\&#39;)&quot;]&#39;).classList.add(&#39;active&#39;);
                document.getElementById(&#39;tab-trainer&#39;).classList.add(&#39;active&#39;);
            } else {
                document.querySelector(&#39;.tab-btn[onclick=&quot;switchTab(\&#39;guide\&#39;)&quot;]&#39;).classList.add(&#39;active&#39;);
                document.getElementById(&#39;tab-guide&#39;).classList.add(&#39;active&#39;);
            }
        }

        // Load Practice Example (supports legacy and new array signatures)
        function loadExample(init1, rhyme1, tone1, init2, rhyme2, tone2, isNeutral2 = false) {
            if (Array.isArray(init1)) {
                const inits = init1;
                const rhymes = rhyme1;
                const tones = tone1;
                const neutrals = init2 || [];
                const structure = rhyme2 || &#39;sequential&#39;;
                
                const count = inits.length;
                setWordCount(count);
                if (count === 4) {
                    setFourSyllableStructure(structure);
                }
                
                for (let i = 0; i &lt; count; i++) {
                    document.getElementById(`init${i+1}`).value = inits[i];
                    document.getElementById(`rhyme${i+1}`).value = rhymes[i];
                    updateToneDropdown(i+1);
                    document.getElementById(`tone${i+1}`).value = tones[i];
                    
                    const neutralBox = document.getElementById(`neutral${i+1}`);
                    if (neutralBox) {
                        neutralBox.checked = !!neutrals[i];
                    }
                }
            } else {
                setWordCount(2);
                document.getElementById(&#39;init1&#39;).value = init1;
                document.getElementById(&#39;rhyme1&#39;).value = rhyme1;
                updateToneDropdown(1);
                document.getElementById(&#39;tone1&#39;).value = tone1;
                
                document.getElementById(&#39;init2&#39;).value = init2;
                document.getElementById(&#39;rhyme2&#39;).value = rhyme2;
                updateToneDropdown(2);
                document.getElementById(&#39;tone2&#39;).value = tone2;
                
                document.getElementById(&#39;neutral2&#39;).checked = !!isNeutral2;
            }
            
            calculateSandhi();
            switchTab(&#39;trainer&#39;);
        }

        // Syllable builders change listeners
        function onSyllableChange(wordNum) {
            calculateSandhi();
        }

        // Rhyme change listener
        function onRhymeChange(wordNum) {
            updateToneDropdown(wordNum);
            calculateSandhi();
        }

        // Theme toggle
        function toggleTheme() {
            const root = document.documentElement;
            const currentTheme = root.getAttribute(&#39;data-theme&#39;);
            const targetTheme = currentTheme === &#39;dark&#39; ? &#39;light&#39; : &#39;dark&#39;;
            root.setAttribute(&#39;data-theme&#39;, targetTheme);
            document.getElementById(&#39;theme-toggle&#39;).innerText = targetTheme === &#39;dark&#39; ? &#39;☀️ Light Mode&#39; : &#39;🌙 Dark Mode&#39;;
            localStorage.setItem(&quot;sandhi_theme&quot;, targetTheme);
        }

        // Initialize state
        window.addEventListener(&#39;DOMContentLoaded&#39;, () =&gt; {
            // Load saved theme
            const savedTheme = localStorage.getItem(&quot;sandhi_theme&quot;) || &quot;light&quot;;
            document.documentElement.setAttribute(&#39;data-theme&#39;, savedTheme);
            document.getElementById(&#39;theme-toggle&#39;).innerText = savedTheme === &#39;dark&#39; ? &#39;☀️ Light Mode&#39; : &#39;🌙 Dark Mode&#39;;
            
            // Populate options from card 1 to other cards
            const initOptions = document.getElementById(&#39;init1&#39;).innerHTML;
            const rhymeOptions = document.getElementById(&#39;rhyme1&#39;).innerHTML;
            for (let i = 2; i &lt;= 4; i++) {
                document.getElementById(`init${i}`).innerHTML = initOptions;
                document.getElementById(`rhyme${i}`).innerHTML = rhymeOptions;
            }
            
            // Select default initials and rhymes
            document.getElementById(&#39;init1&#39;).value = &quot;&quot;;
            document.getElementById(&#39;rhyme1&#39;).value = &quot;a&quot;;
            
            document.getElementById(&#39;init2&#39;).value = &quot;ng&quot;;
            document.getElementById(&#39;rhyme2&#39;).value = &quot;ng&quot;;
            
            document.getElementById(&#39;init3&#39;).value = &quot;l&quot;;
            document.getElementById(&#39;rhyme3&#39;).value = &quot;ang&quot;;
            
            document.getElementById(&#39;init4&#39;).value = &quot;t&quot;;
            document.getElementById(&#39;rhyme4&#39;).value = &quot;oo&quot;;
            
            // Populate initial Tones based on set rhymes
            for (let i = 1; i &lt;= 4; i++) {
                updateToneDropdown(i);
            }
            
            // Set default tones and checkbox states
            document.getElementById(&#39;tone1&#39;).value = &quot;1&quot;;
            
            document.getElementById(&#39;tone2&#39;).value = &quot;5&quot;;
            document.getElementById(&#39;neutral2&#39;).checked = false;
            
            document.getElementById(&#39;tone3&#39;).value = &quot;5&quot;;
            document.getElementById(&#39;neutral3&#39;).checked = false;
            
            document.getElementById(&#39;tone4&#39;).value = &quot;7&quot;;
            document.getElementById(&#39;neutral4&#39;).checked = false;
            
            // Set default word count mode
            setWordCount(2);
            
            // Speed slider display listener
            const slider = document.getElementById(&#39;speed-rate&#39;);
            const valDisplay = document.getElementById(&#39;speed-value&#39;);
            slider.addEventListener(&#39;input&#39;, () =&gt; {
                valDisplay.innerText = `${slider.value}x`;
            });
        });
    &lt;/script&gt;
